<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WindSpots - Shared spot</title>
    <link rel="icon" href="../favicon.png">
    <link rel="stylesheet" href="../site.css">
</head>
<body>
    <div class="doc-head">
        <header class="topbar">
            <a class="brand" href="/">
                <img src="../img/icon.png" alt="" width="32" height="32">
                <span>WindSpots</span>
            </a>
            <nav class="toplinks" aria-label="Site">
                <a href="../SUPPORT.html">Support</a>
                <a href="../PRIVACY.html">Privacy</a>
                <a href="../TERMS_OF_USE.html">Terms</a>
            </nav>
        </header>
    </div>

    <main class="doc">
        <h1 id="title">A spot was shared with you</h1>
        <p>Open this link on an iPhone with WindSpots installed to add the spot and see its forecast.</p>
        <p id="coords"></p>
        <p><a id="open" class="store-badge" href="#" style="text-decoration:none;margin-top:12px">Open in WindSpots</a></p>
    </main>

    <script>
        // Shared links look like /add-spot?name=…&lat=…&lon=…
        var params = new URLSearchParams(window.location.search);
        var name = params.get("name");
        var lat = params.get("lat");
        var lon = params.get("lon");
        if (name) {
            document.getElementById("title").textContent = name;
        }
        if (lat && lon) {
            document.getElementById("coords").textContent = lat + ", " + lon;
        }
        document.getElementById("open").href = "windspots://add-spot" + window.location.search;
    </script>

    <footer class="footer">
        <p class="wrap fine">Weather data by <a href="https://open-meteo.com">Open-Meteo.com</a> (CC BY 4.0). © 2026 Make Algo.</p>
    </footer>
</body>
</html>
